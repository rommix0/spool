<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1311 1311" width="1311" height="1311">
  <title>Aluminum tape reel</title>
  <defs>
    <!-- one cutout, defined at the left position; rotated 120/240 for the others -->
    <path id="cutout" d="M 128 490 Q 122 488 118 492 L 100 695 Q 100 705 110 706
                         L 425 688 Q 438 686 440 674 L 446 592 Q 446 580 434 577 Z"
          stroke-linejoin="round"/>
    <mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="1311" height="1311">
      <rect width="1311" height="1311" fill="#fff"/>
      <g fill="#000">
        <use href="#cutout"/>
        <use href="#cutout" transform="rotate(120 655 655)"/>
        <use href="#cutout" transform="rotate(240 655 655)"/>
      </g>
    </mask>
    <radialGradient id="disc" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#e6e6e6"/>
    </radialGradient>
    <g id="screw">
      <circle r="30" fill="#d9d9d9" stroke="#bdbdbd" stroke-width="2"/>
      <circle r="21" fill="#c4c4c4" stroke="#9a9a9a" stroke-width="2"/>
      <path d="M -12 0 H 12 M 0 -12 V 12" stroke="#777" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- disc with three cutouts -->
  <g mask="url(#holes)">
    <circle cx="655" cy="655" r="640" fill="url(#disc)" stroke="#d2d2d2" stroke-width="2"/>
  </g>

  <!-- cutout edge shading -->
  <g fill="none" stroke="#cfcfcf" stroke-width="3" stroke-linejoin="round">
    <use href="#cutout"/>
    <use href="#cutout" transform="rotate(120 655 655)"/>
    <use href="#cutout" transform="rotate(240 655 655)"/>
  </g>

  <!-- centre hub -->
  <circle cx="655" cy="655" r="76" fill="#dcdcdc" stroke="#b5b5b5" stroke-width="3"/>
  <circle cx="655" cy="655" r="62" fill="#e9e9e9" stroke="#c8c8c8" stroke-width="2"/>
  <g stroke="#bdbdbd" stroke-width="10" stroke-linecap="round">
    <path d="M 655 655 L 655 605"/>
    <path d="M 655 655 L 698 680"/>
    <path d="M 655 655 L 612 680"/>
  </g>
  <circle cx="655" cy="655" r="20" fill="#ffffff" stroke="#c4c4c4" stroke-width="2"/>

  <!-- screws -->
  <use href="#screw" x="580" y="510"/>
  <use href="#screw" x="822" y="680"/>
  <use href="#screw" x="552" y="818"/>
</svg>
