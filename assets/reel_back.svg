<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1311 1311" width="1311" height="1311">
  <title>Aluminum tape reel (back)</title>
  <defs>
    <path id="cutout" d="M 128 490 Q 122 488 118 492 L 100 695 Q 100 705 110 706
                         L 425 688 Q 438 686 440 674 L 446 592 Q 446 580 434 577 Z"
          stroke-linejoin="round"/>
    <mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="1311" height="1311">
      <rect width="1311" height="1311" fill="#fff"/>
      <g fill="#000">
        <use href="#cutout"/>
        <use href="#cutout" transform="rotate(120 655 655)"/>
        <use href="#cutout" transform="rotate(240 655 655)"/>
      </g>
    </mask>
    <radialGradient id="disc" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#f1f1f1"/>
      <stop offset="1" stop-color="#e0e0e0"/>
    </radialGradient>
    <!-- back side: flat screw ends / nuts instead of Phillips heads -->
    <g id="nut">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#d6d6d6" stroke="#b0b0b0" stroke-width="2"/>
      <circle r="17" fill="#e4e4e4" stroke="#bdbdbd" stroke-width="2"/>
      <circle r="7" fill="#cfcfcf"/>
    </g>
  </defs>

  <!-- mirrored view of the same disc -->
  <g transform="translate(1311 0) scale(-1 1)">
    <g mask="url(#holes)">
      <circle cx="655" cy="655" r="640" fill="url(#disc)" stroke="#d2d2d2" stroke-width="2"/>
    </g>

    <g fill="none" stroke="#cfcfcf" stroke-width="3" stroke-linejoin="round">
      <use href="#cutout"/>
      <use href="#cutout" transform="rotate(120 655 655)"/>
      <use href="#cutout" transform="rotate(240 655 655)"/>
    </g>

    <!-- hub: plain bore, no spring-star on the back -->
    <circle cx="655" cy="655" r="76" fill="#dcdcdc" stroke="#b5b5b5" stroke-width="3"/>
    <circle cx="655" cy="655" r="62" fill="#e9e9e9" stroke="#c8c8c8" stroke-width="2"/>
    <circle cx="655" cy="655" r="24" fill="#ffffff" stroke="#c4c4c4" stroke-width="2"/>

    <use href="#nut" x="580" y="510"/>
    <use href="#nut" x="822" y="680"/>
    <use href="#nut" x="552" y="818"/>
  </g>
</svg>
